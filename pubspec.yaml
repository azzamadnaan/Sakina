name: sakinah
description: "Sakinah – Islamic AI assistant"
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  video_player: ^2.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    # أيقونة التطبيق – استبدلها بالصورة التي تريدها
    - assets/images/app_icon.png
    # شعار اختيارى يُعرض في حالة فشل تشغيل الفيديو
    - assets/images/splash_logo.png
    # فيديو شاشة البداية – استبدله بالفيديو الخاص بك
    - assets/images/splash_video.mp4
    
