name: Build Sakinah APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Clean project
        run: flutter clean

      - name: Regenerate Android platform files
        run: |
          flutter create --platforms=android --org com.sakinah.app --project-name sakinah .

      - name: Copy custom app icon
        run: |
          SRC="assets/images/app_icon.png"
          if [ -f "$SRC" ]; then
            for dpi in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              name="${dpi%%:*}"
              size="${dpi##*:}"
              mkdir -p "android/app/src/main/res/mipmap-${name}"
              convert "$SRC" -resize "${size}x${size}" \
                "android/app/src/main/res/mipmap-${name}/ic_launcher.png"
            done
          fi

      - name: Update Gradle version
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.0-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Update Kotlin version
        run: |
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "2.0.20" apply false
          }
          include ":app"
          EOF

      - name: Remove default test
        run: rm -f test/widget_test.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sakinah-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
